<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Shop — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 360px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    .emoji { font-size: 64px; margin-bottom: 16px; }
    h1 { color: #16a34a; font-size: 24px; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      background: #16a34a;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
    }
    .btn:active { background: #15803d; }
    .coins {
      background: #fef9c3;
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
    }
    .coins p { color: #854d0e; margin: 0; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🌿</div>
    <h1>Green Shop</h1>
    <p>Abhi internet nahi hai.<br>Internet on karo aur dobara try karo!</p>
    <button class="btn" onclick="window.location.reload()">
      🔄 Dobara Try Karo
    </button>
    <button class="btn" style="background:#e5e7eb; color:#374151;" onclick="window.history.back()">
      ← Wapas Jao
    </button>
    <div class="coins">
      <p>🪙 Coins safe hain!<br>Online aane pe sab wapas milega</p>
    </div>
  </div>
</body>
</html>
